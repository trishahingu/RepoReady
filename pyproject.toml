
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoready"
version = "0.1.0"
description = "An open-source repository health checker."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Trisha Hingu" }
]
dependencies = [
    "rich>=13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

dashboard = [
    "streamlit>=1.40"
]

[project.scripts]
repoready = "repoready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
